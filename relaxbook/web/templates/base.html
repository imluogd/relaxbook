<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title or "RelaxBook" }}{% endblock %} - RelaxBook</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">RelaxBook 听书工具</a>
    <nav>
      <a href="/">书库</a>
    </nav>
    <span class="hint">本机运行 · 浏览器每 2 秒刷新状态</span>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>RelaxBook v1 · 书库、目录与正文、转换结果三个页面 · 全部数据保存在本机数据目录</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
